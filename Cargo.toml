[package]
name = "pnpm-task-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ptt"
path = "src/main.rs"

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0", features = ["crossterm"] }
tokio = { version = "1.51.1", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0.149"
async-recursion = "1.1.1"
futures = "0.3.32"
notify = "8.2.0"
globset = "0.4.18"
regex = "1.12.3"
scopeguard = "1.2.0"
