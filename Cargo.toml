[package]
name = "plexus"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "unpacked"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = true
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = true

[[bin]]
name = "plexus"
path = "src/main.rs"


[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0", features = ["crossterm"] }
ratatui-interact = "0.5.3"
tokio = { version = "1.52.1", features = ["full", "tracing"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
console-subscriber = "0.5.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
async-recursion = "1.1.1"
futures = "0.3.32"
notify = "8.2.0"
globset = "0.4.18"
regex = "1.12.3"
scopeguard = "1.2.0"
# tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "chrono",
  "local-time",
] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
time = { version = "0.3.47", features = [
  "formatting",
  "macros",
  "local-offset",
] }
tracing-appender = "0.2.5"
command-group = { version = "5.0.1", features = ["with-tokio"] }
sha2 = "0.11.0"
hex = "0.4.3"
tempfile = "3.27.0"
globwalk = "0.9.1"
path-clean = "1.0.1"
uuid = { version = "1.23.1", features = ["v4", "fast-rng"] }
better_tokio_select = "0.2.0"
schemars = "1.2.1"
ignore = "0.4.25"
which = "8.0.0"
unicode-width = "0.2"


