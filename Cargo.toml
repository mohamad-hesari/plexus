[package]
name = "pnpm-task-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ptt"
path = "src/main.rs"


[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0", features = ["crossterm"] }
tokio = { version = "1.52.1", features = ["full", "tracing"] }
console-subscriber = "0.5"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0.149"
async-recursion = "1.1.1"
futures = "0.3.32"
notify = "8.2.0"
globset = "0.4.18"
regex = "1.12.3"
scopeguard = "1.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
command-group = { version = "5.0", features = ["with-tokio"] }

[profile.release]
opt-level = "z"   # Optimize for size ("z" is more aggressive than "s")
lto = true        # Enable Link Time Optimization (removes unused code across crates)
codegen-units = 1 # Reduces parallel compilation to allow better global optimization
panic = "abort"   # Removes stack unwinding code (saves ~50-100KB)
strip = true      # Automatically removes symbols and debug info (New in Rust 1.59+)
