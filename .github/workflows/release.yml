name: Release
on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg_name: linux-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg_name: linux-musl-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg_name: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_name: win32-x64

    runs-on: ${{ matrix.os }}
    environment: publish
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Musl Tools (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}-v1
          prefix-key: "v1-rust"

      - name: Set Version Variable
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Sync Cargo.toml version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('Cargo.toml', 'utf8');
            content = content.replace(/^version = \".*\"/m, 'version = \"${{ env.VERSION }}\"');
            fs.writeFileSync('Cargo.toml', content);
          "

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare & Version Package
        shell: bash
        run: |
          cp LICENSE packages/${{ matrix.pkg_name }}/
          cp README.md packages/${{ matrix.pkg_name }}/ || true
          cd packages/${{ matrix.pkg_name }}
          jq ".version = \"${{ env.VERSION }}\"" package.json > temp.json && mv temp.json package.json
          mkdir -p bin
          cp ../../target/${{ matrix.target }}/release/plexus* ./bin/ 2>/dev/null || cp ../../target/${{ matrix.target }}/release/plexus.exe ./bin/

      - name: Publish to NPM
        working-directory: packages/${{ matrix.pkg_name }}
        run: |
          npm install -g npm@latest
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/mohamad-hesari/plexus"
          npm pkg set repository.directory="packages/${{ matrix.pkg_name }}"
          npm pkg set name="@m.hesari/plexus-${{ matrix.pkg_name }}"
          npm publish --access public --provenance

      - name: Deploy to GitHub
        working-directory: packages/${{ matrix.pkg_name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@mohamad-hesari/plexus-${{ matrix.pkg_name }}"
          npm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          npm publish --registry https://npm.pkg.github.com

  publish-main:
    needs: build
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Set Version Variable
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Version Main Package and Deps
        working-directory: packages/main
        run: |
          cp ../../LICENSE .
          cp ../../README.md . || true
          # jq ".version = \"${{ env.VERSION }}\"" package.json > temp.json && mv temp.json package.json
          # jq ".optionalDependencies | map_values(\"${{ env.VERSION }}\")" package.json > deps.json
          # jq ".optionalDependencies = input" package.json deps.json > temp.json && mv temp.json package.json
          jq ".version = \"${{ env.VERSION }}\" | .optionalDependencies[] |= \"${{ env.VERSION }}\"" package.json > temp.json && mv temp.json package.json

      - name: Publish Main
        working-directory: packages/main
        env:
          SCOPE: "@m.hesari"
        run: |
          npm install -g npm@latest
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/mohamad-hesari/plexus"
          npm pkg set repository.directory="packages/main"
          npm pkg set name="$SCOPE/plexus"
          jq --arg scope "$SCOPE/" '.optionalDependencies |= with_entries(.key |= ($scope + .))' package.json > temp.json && mv temp.json package.json
          npm publish --access public --provenance

      - name: Deploy to GitHub
        working-directory: packages/main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOPE: "@mohamad-hesari"
        run: |
          npm pkg set name="$SCOPE/plexus"
          jq --arg scope "$SCOPE/" '.optionalDependencies |= with_entries(.key |= ($scope + .))' package.json > temp.json && mv temp.json package.json
          npm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          npm publish --registry https://npm.pkg.github.com
