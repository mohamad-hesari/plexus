name: Release
on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg_name: linux-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg_name: linux-musl-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg_name: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_name: win32-x64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Musl Tools (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set Version Variable
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Sync Cargo.toml version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('Cargo.toml', 'utf8');
            content = content.replace(/^version = \".*\"/m, 'version = \"${{ env.VERSION }}\"');
            fs.writeFileSync('Cargo.toml', content);
          "

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare & Version Package
        shell: bash
        run: |
          cd packages/${{ matrix.pkg_name }}
          jq ".version = \"${{ env.VERSION }}\"" package.json > temp.json && mv temp.json package.json
          mkdir -p bin
          cp ../../target/${{ matrix.target }}/release/plexus* ./bin/ 2>/dev/null || cp ../../target/${{ matrix.target }}/release/plexus.exe ./bin/

      - name: Publish to NPM
        working-directory: packages/${{ matrix.pkg_name }}
        env:
          MY_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ env.MY_NPM_TOKEN != ' ' }}
        run: |
          npm pkg set name="plexus-${{ matrix.pkg_name }}"
          npm config set //registry.npmjs.org/:_authToken $MY_NPM_TOKEN
          npm publish --access public --registry https://registry.npmjs.org

      - name: Deploy to GitHub
        working-directory: packages/${{ matrix.pkg_name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@mohamad-hesari/plexus-${{ matrix.pkg_name }}"
          npm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          npm publish --registry https://npm.pkg.github.com

  publish-main:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set Version Variable
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Version Main Package and Deps
        working-directory: packages/main
        run: |
          # jq ".version = \"${{ env.VERSION }}\"" package.json > temp.json && mv temp.json package.json
          # jq ".optionalDependencies | map_values(\"${{ env.VERSION }}\")" package.json > deps.json
          # jq ".optionalDependencies = input" package.json deps.json > temp.json && mv temp.json package.json
          jq ".version = \"${{ env.VERSION }}\" | .optionalDependencies[] |= \"${{ env.VERSION }}\"" package.json > temp.json && mv temp.json package.json

      - name: Publish Main
        working-directory: packages/main
        env:
          MY_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ env.MY_NPM_TOKEN != ' ' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken $MY_NPM_TOKEN
          npm publish --access public

      - name: Deploy to GitHub
        working-directory: packages/main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOPE: "@mohamad-hesari"
        run: |
          npm pkg set name="$SCOPE/plexus"
          jq --arg scope "$SCOPE/" '.optionalDependencies |= with_entries(.key |= ($scope + .))' package.json > temp.json && mv temp.json package.json
          npm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          npm publish --registry https://npm.pkg.github.com
